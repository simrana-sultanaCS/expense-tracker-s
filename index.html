<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">
    <header class="app-header">
      <h1>💰 Expense Tracker</h1>
      <p class="subtitle">Track your daily income and expenses easily</p>
    </header>

    <section class="summary-cards">
      <div class="card income">
        <span class="card-label">Total Income</span>
        <span class="card-value" id="totalIncome">৳0.00</span>
      </div>
      <div class="card expense">
        <span class="card-label">Total Expense</span>
        <span class="card-value" id="totalExpense">৳0.00</span>
      </div>
      <div class="card balance">
        <span class="card-label">Balance</span>
        <span class="card-value" id="totalBalance">৳0.00</span>
      </div>
    </section>

    <section class="form-section">
      <h2>Add New Entry</h2>
      <form id="transactionForm">
        <div class="form-row">
          <input type="text" id="title" placeholder="e.g. Groceries, Salary, Bus Fare" required />
          <input type="number" id="amount" placeholder="Amount" min="0.01" step="0.01" required />
        </div>
        <div class="form-row">
          <select id="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
          <select id="category">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Shopping">Shopping</option>
            <option value="Health">Health</option>
            <option value="Salary">Salary</option>
            <option value="Other">Other</option>
          </select>
          <input type="date" id="date" required />
        </div>
        <button type="submit" class="add-btn">+ Add Entry</button>
      </form>
    </section>

    <section class="filter-section">
      <label for="filterCategory">Filter:</label>
      <select id="filterCategory">
        <option value="All">All Categories</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Bills">Bills</option>
        <option value="Shopping">Shopping</option>
        <option value="Health">Health</option>
        <option value="Salary">Salary</option>
        <option value="Other">Other</option>
      </select>
    </section>

    <section class="history-section">
      <h2>Transaction History</h2>
      <ul id="transactionList" class="transaction-list">
        <!-- Transactions injected by JS -->
      </ul>
      <p id="emptyMsg" class="empty-msg">No transactions added yet.</p>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
